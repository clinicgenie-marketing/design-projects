<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Tracker</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F7F7F5;--surface:#FFFFFF;--surface2:#F1EFEA;
    --border:#E7E7E4;--border-strong:#D8D7D2;
    --text:#171715;--text2:#6B6B66;--text3:#9A9A93;
    --complete:#1D9E75;--inprogress:#378ADD;--notstarted:#9A9A93;
    --waiting:#C98A1B;--blocked:#D9534F;--overdue:#D9534F;
    --accent:#6D5DD3;--accent-soft:#EFECFB;
    --radius-lg:12px;--radius-md:10px;--radius-sm:7px;
    --shadow-sm:0 1px 2px rgba(20,20,15,0.04);
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#141412;--surface:#1D1D1B;--surface2:#242422;
      --border:#2C2C29;--border-strong:#38382f;
      --text:#EDEDE8;--text2:#A6A69F;--text3:#75756E;
      --accent-soft:#2A2540;}
  }
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased}

  /* LOGIN */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px 36px;width:100%;max-width:340px;text-align:center;box-shadow:var(--shadow-sm)}
  .login-logo{width:44px;height:44px;background:var(--accent-soft);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:20px}
  .login-title{font-size:18px;font-weight:600;margin-bottom:4px}
  .login-sub{font-size:13px;color:var(--text2);margin-bottom:22px}
  .login-card input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:14px;margin-bottom:10px;outline:none}
  .login-card input:focus{border-color:var(--accent)}
  .login-btn{width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer}
  .login-btn:hover{opacity:.92}
  .login-error{font-size:12px;color:var(--overdue);margin-top:8px;display:none}

  /* SHELL */
  #dashboard{display:none}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 32px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
  .header-logo{width:30px;height:30px;background:var(--accent-soft);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .header-title{font-size:16px;font-weight:600;flex:1}
  .header-right{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text2)}
  .live-dot-wrap{display:flex;align-items:center;gap:6px;color:var(--complete);font-weight:600}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--complete);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .header-sep{width:1px;height:14px;background:var(--border-strong)}
  .header-icon-btn{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);cursor:pointer;background:transparent;border:none}
  .header-icon-btn:hover{background:var(--surface2)}
  .avatar-circle{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}

  main{padding:24px 32px 60px;max-width:1500px;margin:0 auto}

  /* WORKSPACE NAV */
  .workspace-nav{display:flex;gap:28px;margin-bottom:18px;border-bottom:1px solid var(--border)}
  .ws-btn{padding:12px 2px;font-size:14px;font-weight:500;background:transparent;border:none;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:8px;transition:color .15s}
  .ws-btn:hover{color:var(--text)}
  .ws-btn.active{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
  .ws-count{font-size:12px;color:var(--text2);font-weight:600;background:var(--surface2);padding:2px 8px;border-radius:9px}
  .ws-btn.active .ws-count{background:var(--accent-soft);color:var(--accent)}

  /* SECONDARY NAV */
  .secondary-nav{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:9px;margin-bottom:20px;width:fit-content}
  .sec-btn{padding:8px 16px;font-size:13px;font-weight:500;background:transparent;border:none;border-radius:6px;cursor:pointer;color:var(--text2);display:inline-flex;align-items:center;gap:7px;transition:all .15s}
  .sec-btn.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm)}
  .sec-btn svg{flex-shrink:0}

  /* OVERVIEW HEADER */
  .ov-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
  .ov-eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;margin-bottom:4px}
  .ov-title{font-size:21px;font-weight:600}
  .ov-month{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text2);border:1px solid var(--border);padding:7px 14px;border-radius:8px;background:var(--surface)}

  /* KPI CARDS */
  .kpi-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
  @media (max-width:1100px){.kpi-row{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:640px){.kpi-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow-sm)}
  .kpi-card.overdue-tint{background:linear-gradient(0deg,rgba(217,83,79,0.04),rgba(217,83,79,0.04)),var(--surface);border-color:rgba(217,83,79,0.25)}
  .kpi-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .kpi-val{font-size:26px;font-weight:650;line-height:1.1}
  .kpi-lbl{font-size:12.5px;color:var(--text2);margin-top:3px}
  .kpi-sub{font-size:11.5px;color:var(--text3);margin-top:2px}
  .kpi-bar{height:4px;background:var(--border);border-radius:2px;margin-top:12px;overflow:hidden}
  .kpi-bar-fill{height:100%;border-radius:2px}

  /* NEEDS ATTENTION */
  .attn-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px}
  @media (max-width:900px){.attn-strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .attn-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s}
  .attn-item:hover{border-color:var(--border-strong)}
  .attn-item.active{border-color:var(--accent);background:var(--accent-soft)}
  .attn-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .attn-num{font-size:15px;font-weight:650}
  .attn-lbl{font-size:12px;color:var(--text2)}
  .attn-chevron{margin-left:auto;color:var(--text3)}

  /* TOOLBAR */
  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .search-box{position:relative;flex:1;min-width:200px}
  .search-box input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:13.5px;outline:none}
  .search-box input:focus{border-color:var(--accent)}
  .search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3)}
  .tb-select{padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;outline:none}
  .tb-select:focus{border-color:var(--accent)}
  .tb-sort{margin-left:auto;display:flex;align-items:center;gap:6px}

  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center;min-height:20px}
  .filter-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:500}
  .filter-chip button{background:none;border:none;color:inherit;cursor:pointer;font-size:13px;line-height:1;padding:0}
  .clear-all-link{font-size:12.5px;color:var(--accent);cursor:pointer;font-weight:500;background:none;border:none}

  /* TABLE CARD */
  .table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
  .table-card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
  .table-card-title{font-size:14.5px;font-weight:600}
  .table-card-count{font-size:12.5px;color:var(--text2)}
  table.data-table{width:100%;border-collapse:collapse;font-size:13.5px}
  .data-table th{font-size:11.5px;font-weight:600;color:var(--text2);text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
  .data-table td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  .data-table tbody tr:last-child td{border-bottom:none}
  .data-table tbody tr{cursor:pointer;transition:background .12s}
  .data-table tbody tr:hover td{background:var(--surface2)}
  .data-table tbody tr.row-overdue{background:rgba(217,83,79,0.035)}
  .data-table tbody tr.row-overdue:hover td{background:rgba(217,83,79,0.06)}
  .due-cell{font-size:13px;font-weight:600}
  .due-overdue{color:var(--overdue)}
  .due-soon{color:var(--waiting)}
  .overdue-badge{font-size:10px;font-weight:700;color:var(--overdue);background:rgba(217,83,79,0.12);padding:1px 6px;border-radius:6px;margin-left:4px;letter-spacing:.02em;text-transform:uppercase}
  .task-title-cell{font-weight:500;color:var(--text);font-size:13.5px;display:flex;align-items:center;gap:8px}
  .task-dot-sm{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .owner-cell{display:flex;align-items:center;gap:8px}
  .owner-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
  .client-pill{font-size:12px;padding:3px 9px;border-radius:8px;display:inline-block;white-space:nowrap;font-weight:500}
  .pri-pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:8px;white-space:nowrap;font-weight:500}
  .status-pill{font-size:12px;padding:3px 9px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .progress-complete{display:flex;align-items:center;gap:5px;color:var(--complete);font-size:12.5px;font-weight:500}
  .progress-inline{display:flex;align-items:center;gap:7px;min-width:90px}
  .progress-track{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
  .progress-fill{height:100%;border-radius:3px}
  .progress-pct{font-size:12px;font-weight:500;min-width:28px;text-align:right;color:var(--text2)}
  .row-more{color:var(--text3);opacity:0;transition:opacity .12s;padding:2px 6px}
  .data-table tbody tr:hover .row-more{opacity:1}

  .section-month-label{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);padding:16px 0 8px}

  /* CLIENTS NEEDING ATTENTION */
  .attention-table-wrap{margin-top:18px}

  /* WORKLOAD */
  .workload-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .wl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow-sm)}
  .wl-header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .wl-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
  .wl-name{font-size:15px;font-weight:600}
  .wl-load-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.02em}
  .wl-sub{font-size:12.5px;color:var(--text2);margin-top:1px}
  .wl-stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin:14px 0;font-size:12.5px}
  .wl-stat-row{display:flex;justify-content:space-between;color:var(--text2)}
  .wl-stat-row strong{color:var(--text);font-weight:600}
  .wl-upcoming-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin:14px 0 8px;border-top:1px solid var(--border);padding-top:12px}
  .wl-upcoming-item{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 0;color:var(--text2)}
  .wl-upcoming-date{font-weight:600;color:var(--text);min-width:44px}

  /* TIMELINE */
  .timeline-filter-row{display:flex;gap:6px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
  .tl-chip{padding:7px 14px;font-size:12.5px;font-weight:500;background:var(--surface);border:1px solid var(--border);border-radius:16px;cursor:pointer;color:var(--text2)}
  .tl-chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
  .timeline-toggle{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:8px;margin-bottom:16px;width:fit-content}
  .tt-btn{padding:7px 15px;font-size:13px;background:transparent;border:none;border-radius:5px;cursor:pointer;color:var(--text2);font-weight:500}
  .tt-btn.active{background:var(--surface);color:var(--text)}

  .gantt-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
  .gantt-table{border-collapse:collapse;min-width:100%;font-size:12.5px}
  .gantt-table th{position:sticky;top:0;background:var(--surface);font-size:11px;font-weight:600;color:var(--text2);padding:8px 4px;border-bottom:1px solid var(--border);text-align:center;min-width:34px;white-space:nowrap}
  .gantt-table th.task-col{text-align:left;padding:10px 16px;min-width:230px;width:230px;position:sticky;left:0;z-index:2;background:var(--surface)}
  .gantt-table td.task-cell{padding:10px 16px;border-bottom:1px solid var(--border);position:sticky;left:0;background:var(--surface);z-index:1;min-width:230px;width:230px}
  .gantt-bar{position:absolute;top:50%;transform:translateY(-50%);height:20px;border-radius:5px;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;z-index:1}
  .gantt-marker{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;border:2px solid var(--surface);cursor:pointer;z-index:1}
  .gantt-today{position:absolute;top:0;bottom:0;width:1.5px;background:var(--overdue);z-index:3;pointer-events:none}
  .gantt-week-sep{border-right:1px solid var(--border-strong)!important}
  .gantt-month-row th{background:var(--surface2);font-size:12px;font-weight:600;color:var(--text)}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
  .cal-header{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;text-align:center;padding:5px 0}
  .cal-month-title{font-size:15.5px;font-weight:600;margin-bottom:10px;padding:0 4px}
  .cal-cell{aspect-ratio:1;background:var(--surface2);border-radius:8px;padding:7px;display:flex;flex-direction:column;cursor:pointer;border:1px solid transparent;position:relative;min-height:64px}
  .cal-cell:hover{border-color:var(--border-strong)}
  .cal-cell.empty{background:transparent;cursor:default}
  .cal-cell.today{border-color:var(--accent)}
  .cal-day{font-size:12px;font-weight:600;color:var(--text2);position:relative;z-index:1}
  .cal-cell.today .cal-day{color:var(--accent)}
  .cal-count{margin-top:auto;font-size:11.5px;font-weight:600;position:relative;z-index:1}
  .cal-band-0{background:var(--surface2)}
  .cal-band-1{background:rgba(217,83,79,0.06)}
  .cal-band-2{background:rgba(217,83,79,0.12)}
  .cal-band-3{background:rgba(217,83,79,0.22)}

  .loading{text-align:center;padding:48px 24px;color:var(--text2);font-size:14px}
  .spinner{width:26px;height:26px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .view{display:none}
  .view.active{display:block}

  /* DRAWER */
  .drawer-overlay{position:fixed;inset:0;background:rgba(15,15,10,0.28);z-index:100;opacity:0;pointer-events:none;transition:opacity .18s}
  .drawer-overlay.open{opacity:1;pointer-events:all}
  .drawer{position:fixed;right:0;top:0;bottom:0;width:400px;max-width:95vw;background:var(--surface);border-left:1px solid var(--border);z-index:101;transform:translateX(100%);transition:transform .2s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
  .drawer-header-title{font-size:15px;font-weight:600;flex:1}
  .drawer-close{background:none;border:none;cursor:pointer;color:var(--text2);font-size:18px;line-height:1;padding:4px 6px;border-radius:5px}
  .drawer-close:hover{background:var(--surface2)}
  .drawer-body{flex:1;overflow-y:auto;padding:20px 22px}
  .drawer-task-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;margin-bottom:2px}
  .drawer-task-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .drawer-task-id{font-size:12px;color:var(--text3);margin-bottom:18px}
  .drawer-field-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px}
  .drawer-field-row:last-of-type{border-bottom:none}
  .drawer-field-icon{width:16px;color:var(--text3);flex-shrink:0}
  .drawer-field-label{color:var(--text2);min-width:78px}
  .drawer-field-value{flex:1;font-weight:500;display:flex;align-items:center;gap:8px}
  .drawer-section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin:20px 0 8px}
  .drawer-notes-box{background:var(--surface2);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--text2);line-height:1.5}
  .drawer-activity-item{display:flex;gap:10px;padding-bottom:14px;position:relative}
  .drawer-activity-item::before{content:'';position:absolute;left:4px;top:14px;bottom:-2px;width:1px;background:var(--border)}
  .drawer-activity-item:last-child::before{display:none}
  .activity-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:3px}
  .activity-time{font-size:11.5px;color:var(--text3)}
  .activity-title{font-size:13px;font-weight:500;margin-top:1px}
  .activity-by{font-size:12px;color:var(--text3)}
  .drawer-empty-note{font-size:12.5px;color:var(--text3);font-style:italic}

  @media (max-width:900px){
    main{padding:16px}
    header{padding:12px 16px}
    .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr))}
    .attn-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
    .drawer{width:100vw}
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🎨</div>
    <div class="login-title">Team Tracker</div>
    <div class="login-sub">Enter password to continue</div>
    <input type="password" id="pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <button class="login-btn" onclick="login()">Sign in</button>
    <div class="login-error" id="pw-error">Incorrect password</div>
  </div>
</div>

<div id="dashboard">
  <header>
    <div class="header-logo">🎨</div>
    <div class="header-title">Team Tracker</div>
    <div class="header-right">
      <span class="live-dot-wrap"><span class="live-dot"></span>Live</span>
      <span class="header-sep"></span>
      <span id="last-updated">Updated --</span>
      <button class="header-icon-btn" title="Notifications" aria-label="Notifications">

const SC = {complete:'#1D9E75',inprogress:'#378ADD',notstarted:'#9A9A93',blocked:'#C98A1B'};
const CL = {

const HASH_PALETTE = [
  {bg:'#EDEAFB',fg:'#5941C4'},{bg:'#E4F4EC',fg:'#1F7A4D'},{bg:'#FBE9E1',fg:'#A34A22'},
  {bg:'#FBE6EE',fg:'#9C3B62'},{bg:'#E3EEFA',fg:'#255C93'},{bg:'#EBF5DE',fg:'#3F6B15'},
  {bg:'#FBF0D9',fg:'#8A6108'},{bg:'#FBE5E5',fg:'#A32C2C'}
];
const WT_COLORS = ['#6D5DD3','#1D9E75','#D98A3D','#3B82C4','#D9668C','#4C8A2B','#8A5A2B','#378ADD'];
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0}return Math.abs(h)}
function avatarFor(name){
  const n=(name||'?').trim()||'?';
  const p=HASH_PALETTE[hashStr(n)%HASH_PALETTE.length];
  const initials=n.split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'?';
  return {initials,bg:p.bg,fg:p.fg};
}
function memberAvatar(name){
  const d=TEAMS.design.members.find(m=>m.name===name);
  if(d)return d;
  const c=TEAMS.content.members.find(m=>m.name===name);
  if(c)return c;
  return avatarFor(name);
}
function workTypeColor(wt){ if(!wt)return '#9A9A93'; return WT_COLORS[hashStr(wt)%WT_COLORS.length]; }

function getTeam(designerName){
  const n=(designerName||'').trim();
  if(!n)return null;
  if(TEAMS.design.members.some(m=>m.name===n))return 'design';
  if(TEAMS.content.members.some(m=>m.name===n))return 'content';
  return null;
}

let tasks = [];

let activeSecondaryView = 'overview';
let searchQuery = '';
let filterClient = 'all';
let filterOwner = 'all';
let filterStatus = 'all';
let filterPriority = 'all';

let activeTimelineMode = 'gantt';
let ganttFilter = 'active';
let refreshTimer = null;

function statusKey(s){
  const k=(s||'').toLowerCase();
  if(k.includes('block')||k.includes('wait'))return'blocked';
  if(k.includes('complete')&&!k.includes('not'))return'complete';
  if(k.includes('progress'))return'inprogress';
  return'notstarted';
}
function statusLabel(k){
  return {complete:'Complete',inprogress:'In Progress',blocked:'Waiting Approval',notstarted:'Not Started'}[k]||'Not Started';
}
function statusPct(k){return k==='complete'?100:k==='inprogress'?50:0}
function clientColor(c){return CL[c]||avatarFor(c||'?').fg}

function priorityKey(p){
  const v=(p||'').toLowerCase().trim();
  if(v==='high'||v==='h')return'high';
  if(v==='low'||v==='l')return'low';
  return'normal';
}
function priorityPill(p){
  const m=PRI[priorityKey(p)];
  return '<span class="pri-pill" style="background:'+m.bg+';color:'+m.color+'"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="'+m.icon+'"/></svg> '+m.label+'</span>';
}
function statusPill(sk){
  return '<span class="status-pill" style="background:'+SC[sk]+'18;color:'+SC[sk]+'"><span class="status-dot" style="background:'+SC[sk]+'"></span>'+statusLabel(sk)+'</span>';
}

function parseDate(val){
  if(!val||val==='-')return null;
  if(val instanceof Date)return val;
  const s=val.toString().trim();
  if(!s)return null;
  let d=new Date(s);
  if(!isNaN(d))return d;
  const m=s.match(/^(\d{1,2})\s+([A-Za-z]{3,9})(?:\s+(\d{4}))?$/);
  if(m){
    const day=parseInt(m[1],10);
    const mi=MONTHS.findIndex(x=>x.toLowerCase()===m[2].slice(0,3).toLowerCase());
    if(mi>=0){
      const year=m[3]?parseInt(m[3],10):2026;
      return new Date(year,mi,day);
    }
  }
  return null;
}
function fmtDate(val){
  const d=parseDate(val);
  if(!d)return '';
  return d.getDate()+' '+MONTHS[d.getMonth()];
}
function dateSortVal(val){
  const d=parseDate(val);
  return d?d.getTime():Number.POSITIVE_INFINITY;
}
function isOverdue(dateStr,status){
  const sk=statusKey(status);
  if(sk==='complete')return false;
  const d=parseDate(dateStr);
  if(!d)return false;
  const today=new Date();today.setHours(0,0,0,0);
  return d<today;
}
function isSoon(dateStr,status){
  const sk=statusKey(status);
  if(sk==='complete')return false;
  const d=parseDate(dateStr);
  if(!d)return false;
  const today=new Date();today.setHours(0,0,0,0);
  const diff=(d-today)/(1000*60*60*24);
  return diff>=0&&diff<=7;
}
function isDueThisWeek(dateStr,status){
  const sk=statusKey(status);
  if(sk==='complete')return false;
  const d=parseDate(dateStr);
  if(!d)return false;
  const today=new Date();today.setHours(0,0,0,0);
  const dow=(today.getDay()+6)%7;
  const weekStart=new Date(today);weekStart.setDate(today.getDate()-dow);
  const weekEnd=new Date(weekStart);weekEnd.setDate(weekStart.getDate()+6);
  return d>=weekStart&&d<=weekEnd;
}
function isBlocked(t){ return statusKey(t['Current Status'])==='blocked' || (!!(t['Blocker']||'').toString().trim() && statusKey(t['Current Status'])!=='complete'); }
function getLead(t){ return (t['Lead']||t['Main Designer']||'').toString().trim(); }
function getClientName(t){ return (t['Client']||t['Project']||'').toString().trim(); }
function getWorkType(t){ return (t['Work Type']||'').toString().trim(); }
function getProgressPct(t){
  const raw=(t['Progress']||'').toString().trim();
  if(raw){
    const num=parseFloat(raw.replace('%',''));
    if(!isNaN(num))return Math.max(0,Math.min(100,Math.round(num)));
  }
  return statusPct(statusKey(t['Current Status']));
}

function login(){
  const val=document.getElementById('pw-input').value;
  if(val===SITE_PASSWORD){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('dashboard').style.display='block';
    sessionStorage.setItem('auth','1');
    fetchData();
    refreshTimer=setInterval(fetchData,REFRESH_INTERVAL);
  }else{
    document.getElementById('pw-error').style.display='block';
  }
}

function fetchData(){
  const callbackName='cgCallback_'+Date.now();
  window[callbackName]=function(json){
    try{
      if(json.error){console.error(json.error);}
      else{
        tasks=json.data.filter(r=>r['Task']&&r['Task'].toString().trim()!=='');
        updateTeamCounts();
        populateDropdowns();
        renderAll();
        const now=new Date();
        document.getElementById('last-updated').textContent='Updated '+now.toLocaleTimeString('en-SG',{hour:'2-digit',minute:'2-digit'});
      }
    }catch(e){console.error('Render failed',e)}
    delete window[callbackName];
    const s=document.getElementById(callbackName);
    if(s)s.remove();
  };
  const script=document.createElement('script');
  script.id=callbackName;
  script.src=SCRIPT_URL+'?pass=clinicgenie2026&callback='+callbackName;
  script.onerror=function(){
    console.error('Failed to load Apps Script. Check SCRIPT_URL and deployment.');
    delete window[callbackName];
    script.remove();
  };
  document.body.appendChild(script);
}

function getTeamScopedTasks(){
  if(activeTeamFilter==='all')return tasks;
  if(activeTeamFilter==='findclinic')return tasks.filter(t=>t['Team']==='findclinic');
  return tasks.filter(t=>getTeam(t['Main Designer'])===activeTeamFilter);
}

function updateTeamCounts(){
  document.getElementById('tn-all').textContent=tasks.length;
  document.getElementById('tn-design').textContent=tasks.filter(t=>getTeam(t['Main Designer'])==='design').length;
  document.getElementById('tn-content').textContent=tasks.filter(t=>getTeam(t['Main Designer'])==='content').length;
  document.getElementById('tn-findclinic').textContent=tasks.filter(t=>t['Team']==='findclinic').length;
}

function populateDropdowns(){
  const scope=getTeamScopedTasks();
  const isFc=activeTeamFilter==='findclinic';
  const clientSel=document.getElementById('client-select');
  const clientLabel=isFc?'Workstream':'Client';
  const clientValues=[...new Set(scope.map(t=>isFc?getWorkType(t):getClientName(t)).filter(Boolean))].sort();
  clientSel.innerHTML='<option value="all">'+clientLabel+': All</option>'+clientValues.map(c=>'<option value="'+c.replace(/"/g,'')+'"'+(filterClient===c?' selected':'')+'>'+c+'</option>').join('');

  const ownerSel=document.getElementById('owner-select');
  const ownerValues=[...new Set(scope.map(t=>getLead(t)).filter(Boolean))].sort();
  ownerSel.innerHTML='<option value="all">Owner: All</option>'+ownerValues.map(o=>'<option value="'+o.replace(/"/g,'')+'"'+(filterOwner===o?' selected':'')+'>'+o+'</option>').join('');

  document.getElementById('status-select').value=filterStatus;
  document.getElementById('priority-select').value=filterPriority;
}

function setDropdownFilter(kind,val){
  if(kind==='client')filterClient=val;
  if(kind==='owner')filterOwner=val;
  if(kind==='status')filterStatus=val;
  if(kind==='priority')filterPriority=val;
  renderTaskTable();
  renderChips();
}
function setSearchQuery(val){
  searchQuery=val.trim().toLowerCase();
  if(searchQuery==='overdue'){filterStatus='all';activeAttention='overdue';}
  else if(searchQuery==='high priority'){filterPriority='high';}
  else if(searchQuery==='due this week'){activeAttention='dueweek';}
  renderTaskTable();
  renderChips();
  renderAttentionStrip();
}

function clearAllFilters(){
  filterClient='all';filterOwner='all';filterStatus='all';filterPriority='all';

  renderTaskTable();

}

function renderChips(){
  const chips=[];
  if(filterClient!=='all')chips.push({label:filterClient,clear:()=>{filterClient='all';}});
  if(filterOwner!=='all')chips.push({label:filterOwner,clear:()=>{filterOwner='all';}});
  if(filterStatus!=='all')chips.push({label:statusLabel(filterStatus==='overdue'?'notstarted':filterStatus)==='Not Started'&&filterStatus==='overdue'?'Overdue':statusLabel(filterStatus),clear:()=>{filterStatus='all';}});
  if(filterPriority!=='all')chips.push({label:PRI[filterPriority].label+' priority',clear:()=>{filterPriority='all';}});
  const row=document.getElementById('chip-row');
  if(!chips.length){row.innerHTML='';return;}
  let html=chips.map((c,i)=>'<span class="filter-chip">'+c.label+' <button onclick="clearChip('+i+')">&#x2715;</button></span>').join('');
  html+='<button class="clear-all-link" onclick="clearAllFilters()">Clear all</button>';
  row.innerHTML=html;
  window._chipClearFns=chips.map(c=>c.clear);
}
function clearChip(i){
  window._chipClearFns[i]();
  populateDropdowns();
  renderTaskTable();
  renderChips();
}

function setTeamFilter(t){
  activeTeamFilter=t;
  filterClient='all';filterOwner='all';filterStatus='all';filterPriority='all';activeAttention=null;searchQuery='';
  document.getElementById('search-input').value='';
  document.querySelectorAll('.ws-btn').forEach(b=>b.classList.toggle('active',b.dataset.team===t));
  populateDropdowns();
  renderAll();
}

function getFilteredTasks(){
  let list=getTeamScopedTasks().slice();
  const isFc=activeTeamFilter==='findclinic';

  if(searchQuery && !['overdue','high priority','due this week'].includes(searchQuery)){
    list=list.filter(t=>{
      const hay=((t['Task']||'')+' '+getClientName(t)+' '+getLead(t)+' '+getWorkType(t)).toLowerCase();
      return hay.includes(searchQuery);
    });
  }
  if(filterClient!=='all'){
    list=list.filter(t=> isFc ? getWorkType(t)===filterClient : getClientName(t)===filterClient);
  }
  if(filterOwner!=='all')list=list.filter(t=>getLead(t)===filterOwner);
  if(filterPriority!=='all')list=list.filter(t=>priorityKey(t['Priority'])===filterPriority);

  if(filterStatus==='overdue')list=list.filter(t=>isOverdue(t['Deadline'],t['Current Status']));
  else if(filterStatus!=='all')list=list.filter(t=>statusKey(t['Current Status'])===filterStatus);

  if(activeAttention==='overdue')list=list.filter(t=>isOverdue(t['Deadline'],t['Current Status']));
  else if(activeAttention==='highpriority')list=list.filter(t=>priorityKey(t['Priority'])==='high'&&statusKey(t['Current Status'])!=='complete');
  else if(activeAttention==='dueweek')list=list.filter(t=>isDueThisWeek(t['Deadline'],t['Current Status']));
  else if(activeAttention==='waiting')list=list.filter(t=>isBlocked(t));

  list.sort((a,b)=>dateSortVal(a['Deadline'])-dateSortVal(b['Deadline']));
  return list;
}

  const total=scope.length;

  const prog=scope.filter(t=>statusKey(t['Current Status'])==='inprogress').length;
  const ns=scope.filter(t=>statusKey(t['Current Status'])==='notstarted').length;
  const overdue=scope.filter(t=>isOverdue(t['Deadline'],t['Current Status'])).length;
  const pct=total?Math.round((done/total)*1000)/10:0;

  const iconSvg=(path,color,bg)=>'<div class="kpi-icon" style="background:'+bg+';color:'+color+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+path+'</svg></div>';

  const cards=[
    {icon:iconSvg('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>','#6D5DD3','#EDEAFB'),val:total,lbl:'Total Tasks',bar:100,barColor:'#6D5DD3'},

function renderTaskTable(){
  const list=getFilteredTasks();
  const isFc=activeTeamFilter==='findclinic';
  const clientHeader=isFc?'Workstream':'Client';

  document.getElementById('task-table-card').style.display = activeSecondaryView==='overview' ? '' : 'none';

  if(!list.length){
    document.getElementById('tasks-list').innerHTML=
      '<div class="table-card-header"><div class="table-card-title">Tasks</div><div class="table-card-count">0 tasks</div></div>'+
      '<p style="color:var(--text3);padding:32px;text-align:center;font-size:14px">No tasks match this filter.</p>';
    return;
  }

  const today=new Date();
  const currentKey=today.getFullYear()+'-'+String(today.getMonth()).padStart(2,'0');
  const groups={};
  list.forEach(t=>{
    const d=parseDate(t['Deadline']);
    const key=d? d.getFullYear()+'-'+String(d.getMonth()).padStart(2,'0') : '_none';
    if(!groups[key])groups[key]={key,tasks:[],date:d?new Date(d.getFullYear(),d.getMonth(),1):null};
    groups[key].tasks.push(t);
  });
  const currentMonthStart=new Date(today.getFullYear(),today.getMonth(),1);
  const ordered=Object.values(groups).sort((a,b)=>{
    if(a.key==='_none')return 1; if(b.key==='_none')return -1;
    if(a.key===currentKey)return -1; if(b.key===currentKey)return 1;
    const aF=a.date>=currentMonthStart, bF=b.date>=currentMonthStart;
    if(aF&&!bF)return -1; if(!aF&&bF)return 1;
    return aF? a.date-b.date : b.date-a.date;
  });

  let html='';
  ordered.forEach(g=>{
    const isCurrent=g.key===currentKey;
    const label=g.key==='_none' ? 'No deadline' : (isCurrent?'This month':MONTHS[g.date.getMonth()]+' '+g.date.getFullYear());
    html+='<div class="table-card-header"><div class="table-card-title">'+label+'</div><div class="table-card-count">'+g.tasks.length+' task'+(g.tasks.length!==1?'s':'')+'</div></div>';
    html+='<table class="data-table"><thead><tr><th style="width:80px">Due</th><th>Task</th><th style="width:130px">'+clientHeader+'</th><th style="width:110px">Owner</th><th style="width:90px">Priority</th><th style="width:130px">Status</th><th style="width:120px">Progress</th><th style="width:30px"></th></tr></thead><tbody>';
    g.tasks.forEach(t=>{
      const sk=statusKey(t['Current Status']);
      const overdue=isOverdue(t['Deadline'],t['Current Status']);
      const dl=fmtDate(t['Deadline']);
      const idx=tasks.indexOf(t);
      const clientVal=isFc?(getWorkType(t)||'-'):(getClientName(t)||'-');
      const cc=isFc?workTypeColor(clientVal):clientColor(clientVal);
      const owner=getLead(t);
      const av=owner?memberAvatar(owner):null;
      let dueClass='due-cell';
      if(overdue)dueClass+=' due-overdue'; else if(isSoon(t['Deadline'],t['Current Status']))dueClass+=' due-soon';

      let progressHtml;
      if(sk==='complete'){
        progressHtml='<span class="progress-complete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>Complete</span>';
      }else{
        const p=getProgressPct(t);
        progressHtml='<div class="progress-inline"><div class="progress-track"><div class="progress-fill" style="width:'+p+'%;background:'+SC[sk]+'"></div></div><span class="progress-pct">'+p+'%</span></div>';
      }

      html+='<tr class="'+(overdue?'row-overdue':'')+'" onclick="openDrawerSingle('+idx+')">'+
        '<td><span class="'+dueClass+'">'+(dl||'-')+'</span>'+(overdue?'<div class="overdue-badge">Overdue</div>':'')+'</td>'+
        '<td><div class="task-title-cell"><span class="task-dot-sm" style="background:'+SC[sk]+'"></span>'+t['Task']+'</div></td>'+
        '<td><span class="client-pill" style="background:'+cc+'18;color:'+cc+'">'+clientVal+'</span></td>'+
        '<td>'+(av?('<div class="owner-cell"><span class="owner-av" style="background:'+av.bg+';color:'+av.fg+'">'+av.initials+'</span>'+owner+'</div>'):'<span style="color:var(--text3)">-</span>')+'</td>'+
        '<td>'+priorityPill(t['Priority'])+'</td>'+
        '<td>'+statusPill(sk)+'</td>'+
        '<td>'+progressHtml+'</td>'+
        '<td><span class="row-more">&#8942;</span></td>'+
        '</tr>';
    });
    html+='</tbody></table>';
  });
  document.getElementById('tasks-list').innerHTML=html;
}

/* WORKLOAD */
function computeWeightedLoad(list){
  const today=new Date();today.setHours(0,0,0,0);
  let score=0;
  list.forEach(t=>{
    const pk=priorityKey(t['Priority']);
    let w = pk==='high'?3:pk==='low'?1:2;
    const d=parseDate(t['Deadline']);
    if(d){
      const diff=(d-today)/(1000*60*60*24);
      if(diff<0)w+=2; else if(diff<=3)w+=1;
    }
    score+=w;
  });
  return score;
}
function loadLabelFor(score){
  if(score>=24)return {label:'High load',color:'#C0392B',bg:'#FBE5E5'};
  if(score>=12)return {label:'Normal load',color:'#C98A1B',bg:'#FBF0D9'};
  return {label:'Low load',color:'#1F7A4D',bg:'#E4F4EC'};
}

function renderWorkload(){
  let people=[];
  if(activeTeamFilter==='findclinic'){
    const scope=tasks.filter(t=>t['Team']==='findclinic');
    const leads=[...new Set(scope.map(t=>getLead(t)).filter(Boolean))];
    people=leads.map(name=>({name,av:avatarFor(name),tasksAll:scope.filter(t=>getLead(t)===name)}));
  }else{
    const teamsToShow = activeTeamFilter==='all' ? ['design','content'] : [activeTeamFilter];
    teamsToShow.forEach(tk=>{
      TEAMS[tk].members.forEach(m=>{
        const mine=tasks.filter(t=>(t['Main Designer']||'').trim()===m.name);
        if(mine.length)people.push({name:m.name,av:m,tasksAll:mine});
      });
    });
  }

  if(!people.length){
    document.getElementById('view-workload').innerHTML='<p style="color:var(--text3);padding:32px;text-align:center">No tasks assigned yet.</p>';
    return;
  }

  let html='<div class="workload-grid">';
  people.forEach(p=>{
    const mine=p.tasksAll;
    const dn=mine.filter(t=>statusKey(t['Current Status'])==='complete');
    const active=mine.filter(t=>statusKey(t['Current Status'])!=='complete');
    const ip=active.filter(t=>statusKey(t['Current Status'])==='inprogress');
    const wt=active.filter(t=>isBlocked(t));
    const overdue=active.filter(t=>isOverdue(t['Deadline'],t['Current Status']));
    const highPri=active.filter(t=>priorityKey(t['Priority'])==='high');
    const dueWeek=active.filter(t=>isDueThisWeek(t['Deadline'],t['Current Status']));
    const score=computeWeightedLoad(active);
    const ll=loadLabelFor(score);
    const upcoming=active.slice().sort((a,b)=>dateSortVal(a['Deadline'])-dateSortVal(b['Deadline'])).slice(0,3);

    html+='<div class="wl-card">'+
      '<div class="wl-header"><div class="wl-avatar" style="background:'+p.av.bg+';color:'+p.av.fg+'">'+p.av.initials+'</div>'+
      '<div style="flex:1"><div class="wl-name">'+p.name+'</div><div class="wl-sub">'+active.length+' active tasks &middot; '+dueWeek.length+' due this week</div></div>'+
      '<span class="wl-load-badge" style="background:'+ll.bg+';color:'+ll.color+'">'+ll.label+'</span></div>'+
      '<div class="wl-stats-grid">'+
      '<div class="wl-stat-row"><span>High priority</span><strong>'+highPri.length+'</strong></div>'+
      '<div class="wl-stat-row"><span>In progress</span><strong>'+ip.length+'</strong></div>'+
      '<div class="wl-stat-row"><span>Waiting</span><strong>'+wt.length+'</strong></div>'+
      '<div class="wl-stat-row"><span>Overdue</span><strong style="color:'+(overdue.length?'#C0392B':'inherit')+'">'+overdue.length+'</strong></div>'+
      '</div>';
    if(upcoming.length){
      html+='<div class="wl-upcoming-label">Upcoming</div>';
      upcoming.forEach(t=>{
        const idx=tasks.indexOf(t);
        html+='<div class="wl-upcoming-item" onclick="openDrawerSingle('+idx+')" style="cursor:pointer"><span class="wl-upcoming-date">'+(fmtDate(t['Deadline'])||'-')+'</span><span>'+t['Task']+'</span></div>';
      });
    }
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('view-workload').innerHTML=html;
}

/* TIMELINE */
function buildGanttFilterRow(){
  const chips=[
    {key:'all',label:'All'},{key:'active',label:'Active'},
    {key:'highpriority',label:'High Priority'},{key:'overdue',label:'Overdue'}
  ];
  document.getElementById('gantt-filter-row').innerHTML=chips.map(c=>
    '<button class="tl-chip'+(ganttFilter===c.key?' active':'')+'" onclick="setGanttFilter(\''+c.key+'\')">'+c.label+'</button>'
  ).join('');
}
function setGanttFilter(k){ ganttFilter=k; buildGanttFilterRow(); renderTimelineView(); }

function setTimelineMode(m){
  activeTimelineMode=m;
  document.querySelectorAll('.tt-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  renderTimelineView();
}
function renderTimelineView(){
  if(activeTimelineMode==='gantt')renderGantt(); else renderCalendar();
}

function ganttScopedTasks(){
  let scoped=getTeamScopedTasks();
  if(ganttFilter==='active')scoped=scoped.filter(t=>statusKey(t['Current Status'])!=='complete');
  else if(ganttFilter==='highpriority')scoped=scoped.filter(t=>priorityKey(t['Priority'])==='high'&&statusKey(t['Current Status'])!=='complete');
  else if(ganttFilter==='overdue')scoped=scoped.filter(t=>isOverdue(t['Deadline'],t['Current Status']));
  return scoped;
}

function renderGantt(){
  const scoped=ganttScopedTasks();
  const dated=scoped.map(t=>({t,start:parseDate(t['Date Given']),end:parseDate(t['Deadline'])})).filter(x=>x.start);
  if(!dated.length){
    document.getElementById('timeline-content').innerHTML='<p style="color:var(--text3);padding:32px;text-align:center">No dated tasks to display.</p>';
    return;
  }
  let minD=new Date(Math.min(...dated.map(x=>x.start.getTime())));
  let maxD=new Date(Math.max(...dated.map(x=>(x.end||x.start).getTime())));
  minD=new Date(minD.getFullYear(),minD.getMonth(),minD.getDate());
  minD.setDate(minD.getDate()-(minD.getDay()||7)+1);
  maxD=new Date(maxD.getFullYear(),maxD.getMonth(),maxD.getDate());
  maxD.setDate(maxD.getDate()+7);
  const totalDays=Math.ceil((maxD-minD)/(1000*60*60*24));
  const dayWidth=34;
  const today=new Date();today.setHours(0,0,0,0);

  const months=[];
  let cur=new Date(minD);
  while(cur<=maxD){
    const mKey=cur.getFullYear()+'-'+cur.getMonth();
    const existing=months.find(m=>m.key===mKey);
    if(existing)existing.days++; else months.push({key:mKey,label:MONTHS[cur.getMonth()]+' '+cur.getFullYear(),days:1});
    cur.setDate(cur.getDate()+1);
  }
  let dayHeaders='',monthHeaders='';
  months.forEach(m=>{monthHeaders+='<th colspan="'+m.days+'" style="text-align:center">'+m.label+'</th>';});
  cur=new Date(minD);
  for(let i=0;i<totalDays;i++){
    dayHeaders+='<th class="'+(cur.getDay()===1?'gantt-week-sep':'')+'">'+cur.getDate()+'</th>';
    cur.setDate(cur.getDate()+1);
  }

  const sorted=dated.sort((a,b)=>a.start-b.start);
  let rows='';
  sorted.forEach(function(item){
    const t=item.t,start=item.start,end=item.end;
    const sk=statusKey(t['Current Status']);
    const cc=clientColor(getClientName(t));
    const startOffset=Math.floor((start-minD)/(1000*60*60*24));
    const endOffset=end?Math.floor((end-minD)/(1000*60*60*24)):startOffset;
    const barWidth=Math.max(1,(endOffset-startOffset+1))*dayWidth-4;
    const barLeft=startOffset*dayWidth+2;
    const isMarker=!end;
    const todayOffset=Math.floor((today-minD)/(1000*60*60*24));
    const todayLeft=todayOffset>=0&&todayOffset<totalDays?'<div class="gantt-today" style="left:'+(todayOffset*dayWidth+dayWidth/2)+'px"></div>':'';
    const barColor=isBlocked(t)?'#C98A1B':SC[sk];
    let dayDivs='';
    for(let i=0;i<totalDays;i++){
      const d=new Date(minD);d.setDate(d.getDate()+i);
      dayDivs+='<div style="width:'+dayWidth+'px;'+(d.getDay()===1?'border-left:1px solid var(--border-strong);':'')+'border-right:1px solid var(--border);flex-shrink:0"></div>';
    }
    const idx=tasks.indexOf(t);
    const owner=getLead(t);
    rows+='<tr><td class="task-cell"><div style="font-weight:500;font-size:13px">'+t['Task']+'</div><div style="display:flex;gap:5px;align-items:center;margin-top:4px;flex-wrap:wrap"><span class="client-pill" style="background:'+cc+'18;color:'+cc+';font-size:11px;padding:2px 7px">'+(getClientName(t)||'-')+'</span><span style="font-size:11.5px;color:var(--text3)">'+(owner||'-')+'</span></div></td><td colspan="'+totalDays+'" style="position:relative;padding:0;border-bottom:1px solid var(--border);height:50px"><div style="position:absolute;inset:0;display:flex">'+dayDivs+'</div>'+todayLeft+(isMarker?'<div class="gantt-marker" style="left:'+(barLeft+dayWidth/2-2)+'px;background:'+barColor+'" onclick="openDrawerSingle('+idx+')" title="'+t['Task']+'"></div>':'<div class="gantt-bar" style="left:'+barLeft+'px;width:'+barWidth+'px;background:'+barColor+'" onclick="openDrawerSingle('+idx+')" title="'+t['Task']+'">'+(barWidth>60?t['Task']:'')+'</div>')+'</td></tr>';
  });

  document.getElementById('timeline-content').innerHTML=
    '<div class="gantt-scroll"><table class="gantt-table"><thead><tr class="gantt-month-row"><th class="task-col">Task</th>'+monthHeaders+'</tr><tr><th class="task-col"></th>'+dayHeaders+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div style="margin-top:10px;font-size:12.5px;color:var(--text3)">Bar = Date Given to Deadline. Red line = today. Amber = waiting/blocked.</div>';
}

function renderCalendar(){
  const scoped=getTeamScopedTasks();
  const today=new Date();today.setHours(0,0,0,0);
  const months=[new Date(today.getFullYear(),today.getMonth(),1),new Date(today.getFullYear(),today.getMonth()+1,1)];
  let html='';
  months.forEach(monthStart=>{
    const monthEnd=new Date(monthStart.getFullYear(),monthStart.getMonth()+1,0);
    const firstWeekday=(monthStart.getDay()+6)%7;
    const monthTasks=scoped.filter(t=>{
      const d=parseDate(t['Deadline']);
      return d&&d.getMonth()===monthStart.getMonth()&&d.getFullYear()===monthStart.getFullYear();
    });
    const byDay={};
    monthTasks.forEach(t=>{
      const d=parseDate(t['Deadline']);
      const k=d.getDate();
      if(!byDay[k])byDay[k]=[];
      byDay[k].push(t);
    });
    html+='<div class="cal-month-title">'+MONTHS[monthStart.getMonth()]+' '+monthStart.getFullYear()+' <span style="font-weight:400;color:var(--text3);font-size:13px;margin-left:8px">'+monthTasks.length+' task'+(monthTasks.length!==1?'s':'')+' due</span></div><div class="cal-grid">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>'<div class="cal-header">'+d+'</div>').join('');
    for(let i=0;i<firstWeekday;i++)html+='<div class="cal-cell empty"></div>';
    for(let day=1;day<=monthEnd.getDate();day++){
      const cellDate=new Date(monthStart.getFullYear(),monthStart.getMonth(),day);
      const isToday=cellDate.getTime()===today.getTime();
      const load=(byDay[day]||[]).length;
      let band='cal-band-0';
      if(load>=5)band='cal-band-3'; else if(load>=3)band='cal-band-2'; else if(load>=1)band='cal-band-1';
      html+='<div class="cal-cell '+band+' '+(isToday?'today':'')+'" onclick="openCalendarDay('+monthStart.getFullYear()+','+monthStart.getMonth()+','+day+')"><div class="cal-day">'+day+'</div>'+(load?'<div class="cal-count">'+load+' due</div>':'')+'</div>';
    }
    html+='</div>';
  });
  html+='<div style="margin-top:6px;font-size:12.5px;color:var(--text3)">Cells shaded by deadline density. Click any day to see tasks due then.</div>';
  document.getElementById('timeline-content').innerHTML=html;
}

function openCalendarDay(y,m,d){
  const scoped=getTeamScopedTasks();
  const target=new Date(y,m,d);
  const list=scoped.filter(t=>{
    const dd=parseDate(t['Deadline']);
    return dd&&dd.getTime()===target.getTime();
  });
  showTaskListDrawer('Due '+d+' '+MONTHS[m]+' '+y,list);
}

/* DRAWER */
function openDrawerSingle(idx){
  const t=tasks[idx];
  if(!t)return;
  const sk=statusKey(t['Current Status']);
  const cc=clientColor(getClientName(t));
  const owner=getLead(t);
  const av=owner?memberAvatar(owner):null;
  const p=getProgressPct(t);
  const notes=(t['Blocker']||t['Notes']||t['Remarks']||'').toString().trim();
  const taskId=(t['Task ID']||'').toString().trim();

  let body='<div class="drawer-task-title"><span class="drawer-task-dot" style="background:'+SC[sk]+'"></span>'+t['Task']+'</div>';
  if(taskId)body+='<div class="drawer-task-id">ID: '+taskId+'</div>'; else body+='<div style="margin-bottom:18px"></div>';

  const rows=[
    {icon:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/>',label:'Client',value:'<span class="client-pill" style="background:'+cc+'18;color:'+cc+'">'+(getClientName(t)||'-')+'</span>'},
    {icon:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/>',label:'Owner',value: av? ('<span class="owner-cell"><span class="owner-av" style="background:'+av.bg+';color:'+av.fg+'">'+av.initials+'</span>'+owner+'</span>') : '-'},
    {icon:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',label:'Status',value:statusPill(sk)},
    {icon:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22V3"/>',label:'Priority',value:priorityPill(t['Priority'])},
    {icon:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',label:'Deadline',value:(fmtDate(t['Deadline'])||'No deadline')},
    {icon:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/>',label:'Progress',value: sk==='complete' ? '<span class="progress-complete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>Complete</span>' : ('<div class="progress-inline" style="min-width:120px"><div class="progress-track"><div class="progress-fill" style="width:'+p+'%;background:'+SC[sk]+'"></div></div><span class="progress-pct">'+p+'%</span></div>')}
  ];
  rows.forEach(r=>{
    body+='<div class="drawer-field-row"><span class="drawer-field-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+r.icon+'</svg></span><span class="drawer-field-label">'+r.label+'</span><span class="drawer-field-value">'+r.value+'</span></div>';
  });

  body+='<div class="drawer-section-label">Notes</div>';
  body+= notes ? ('<div class="drawer-notes-box">'+notes+'</div>') : '<div class="drawer-empty-note">No notes recorded for this task.</div>';

  document.getElementById('drawer-body').innerHTML=body;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
}

function showTaskListDrawer(title,list){
  let body='<div class="drawer-task-title">'+title+'</div><div style="margin-bottom:16px;color:var(--text2);font-size:13px">'+list.length+' task'+(list.length!==1?'s':'')+'</div>';
  if(!list.length){
    body+='<div class="drawer-empty-note">No tasks here.</div>';
  }else{
    list.sort((a,b)=>dateSortVal(a['Deadline'])-dateSortVal(b['Deadline']));
    list.forEach(t=>{
      const sk=statusKey(t['Current Status']);
      const cc=clientColor(getClientName(t));
      body+='<div style="background:var(--surface2);border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:pointer" onclick="openDrawerSingle('+tasks.indexOf(t)+')">'+
        '<div style="font-weight:500;font-size:13.5px;margin-bottom:6px">'+t['Task']+'</div>'+
        '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+
        '<span class="client-pill" style="background:'+cc+'18;color:'+cc+'">'+(getClientName(t)||'-')+'</span>'+
        statusPill(sk)+
        '</div></div>';
    });
  }
  document.getElementById('drawer-body').innerHTML=body;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

function switchView(id){
  activeSecondaryView=id;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.sec-btn').forEach(t=>t.classList.toggle('active',t.dataset.view===id));
  document.getElementById('view-'+id).classList.add('active');
  if(id==='timeline'){ buildGanttFilterRow(); renderTimelineView(); }
  if(id==='workload'){ renderWorkload(); }
}

if(sessionStorage.getItem('auth')==='1'){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('dashboard').style.display='block';
  fetchData();
  refreshTimer=setInterval(fetchData,REFRESH_INTERVAL);
}
</script>
</body>
</html>
